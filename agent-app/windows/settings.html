<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Nexus Agent — Settings</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; padding: 16px; font-size: 13px; color: #222; }
  label { display: block; margin-top: 12px; font-weight: 600; }
  .hint { color: #777; font-size: 11px; margin-top: 2px; }
  input[type=text], select { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; font-size: 13px; }
  .row { display: flex; gap: 6px; }
  .row input { flex: 1; }
  button { padding: 6px 12px; font-size: 13px; cursor: pointer; }
  #testOutput { margin-top: 8px; background: #f5f5f5; padding: 8px; border-radius: 4px; max-height: 100px; overflow-y: auto; white-space: pre-wrap; font-family: monospace; font-size: 11px; display: none; }
  .actions { margin-top: 20px; display: flex; justify-content: space-between; }
  .status { font-size: 11px; margin-top: 4px; }
  .ok { color: #16a34a; } .err { color: #dc2626; }
</style>
</head>
<body>
  <h2 style="margin-top:0">Nexus Agent</h2>

  <label>Server</label>
  <input type="text" id="serverUrl" placeholder="ws://host:port" />
  <div class="hint">ที่อยู่ notify-server (ถามผู้ดูแลระบบถ้าไม่รู้)</div>

  <label>Nexus member id</label>
  <input type="text" id="memberId" placeholder="เรียก whoami ผ่าน nexus-mcp เพื่อหา id ของตัวเอง" />

  <label>Shared secret</label>
  <input type="text" id="secret" placeholder="ขอจากผู้ดูแล notify-server" />

  <label>AI ที่จะใช้</label>
  <select id="preset"></select>

  <label>Command</label>
  <input type="text" id="command" />
  <div class="hint">{{prompt}} จะถูกแทนที่ด้วยรายละเอียดงานอัตโนมัติ</div>

  <label>โฟลเดอร์โปรเจกต์ (working directory)</label>
  <div class="row">
    <input type="text" id="workDir" placeholder="/path/to/your/project" />
    <button id="browseBtn">เลือก…</button>
  </div>

  <div class="actions">
    <button id="testBtn">Test</button>
    <button id="saveBtn">Save</button>
  </div>
  <div id="testStatus" class="status"></div>
  <pre id="testOutput"></pre>

  <script src="settings-renderer.js"></script>
</body>
</html>
